name: Build and release MM HATS INSTALLER

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release package
        run: |
          chmod +x build_release.sh
          ./build_release.sh

      - name: Restore desktop installer apps
        run: |
          mkdir -p out/desktop
          curl -fL "https://github.com/TechRepairs4U/MM-HATS-INSTALLER/releases/download/hats-installer/HATS-Installer-Windows.x64.exe" -o out/desktop/HATS-Installer-Windows.x64.exe
          curl -fL "https://github.com/TechRepairs4U/MM-HATS-INSTALLER/releases/download/hats-installer/HATS-Installer.dmg" -o out/desktop/HATS-Installer.dmg

      - name: Publish installer release
        uses: softprops/action-gh-release@v2
        with:
          name: MM HATS INSTALLER ${{ github.ref_name }}
          files: |
            out/MM-HATS-INSTALLER-*.zip
            build/Release/mm-tools.nro
            out/desktop/HATS-Installer-Windows.x64.exe
            out/desktop/HATS-Installer.dmg
