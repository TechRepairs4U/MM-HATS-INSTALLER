name: Build and release MM HATS INSTALLER

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release package
        run: |
          chmod +x build_release.sh
          ./build_release.sh

      - name: Restore desktop installer apps
        run: |
          mkdir -p out/desktop
          curl -fL "https://github.com/TechRepairs4U/MM-HATS-INSTALLER/releases/download/hats-installer/HATS-Installer-Windows.x64.exe" -o out/desktop/HATS-Installer-Windows.x64.exe
          curl -fL "https://github.com/TechRepairs4U/MM-HATS-INSTALLER/releases/download/hats-installer/HATS-Installer.dmg" -o out/desktop/HATS-Installer.dmg

      - name: Prepare NSP keyset
        id: nsp_keys
        shell: bash
        env:
          HACBREWPACK_KEYS_B64: ${{ secrets.HACBREWPACK_KEYS_B64 }}
        run: |
          if [ -z "${HACBREWPACK_KEYS_B64}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HACBREWPACK_KEYS_B64 is not configured; skipping NSP build."
          else
            printf '%s' "${HACBREWPACK_KEYS_B64}" | base64 --decode > "$RUNNER_TEMP/keys.dat"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build full installable NSP
        if: steps.nsp_keys.outputs.available == 'true'
        shell: bash
        run: |
          chmod +x build_nsp.sh
          HACBREWPACK_KEYSET="$RUNNER_TEMP/keys.dat" ./build_nsp.sh

      - name: Publish installer release
        uses: softprops/action-gh-release@v2
        with:
          name: MM HATS INSTALLER ${{ github.ref_name }}
          files: |
            out/MM-HATS-INSTALLER-*.zip
            out/MM-HATS-INSTALLER-*.nsp
            out/desktop/HATS-Installer-Windows.x64.exe
            out/desktop/HATS-Installer.dmg
          fail_on_unmatched_files: false
